name: Deploy

on:
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # No dependency install scripts: nothing from npm runs code before wrangler gets the token. Only esbuild and
      # workerd have one, a check of the native binary that npm installs as an optional dependency anyway.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Same tests against the live site; the short wait lets the new version reach every Cloudflare location
      - name: Check the live site
        run: sleep 15 && node --test test/site.test.js
        env:
          SITE_URL: https://jodev.co.za
