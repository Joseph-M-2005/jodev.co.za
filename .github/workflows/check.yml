name: Check

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Same install as Deploy, so a dependency that needs its install script fails here first
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
